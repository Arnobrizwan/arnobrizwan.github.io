<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>og-image source</title>
<!-- Source for og-image.png. Render at a 1200x630 viewport with deviceScaleFactor 2 (2400x1260 output). -->
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0b0b}
.card{position:relative;width:1200px;height:630px;padding:62px 64px 0;color:#f2efe6;background:#0b0b0b;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:14px;background:#c8f73c}
.orb{position:absolute;right:-150px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(200,247,60,.22),rgba(200,247,60,.04) 60%,transparent 72%)}
.kick{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;letter-spacing:.2em;color:#c8f73c;margin-top:8px}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:78px;line-height:.95;letter-spacing:-.03em;margin-top:26px}
h1 .g{color:#c8f73c}
h1 .z{color:#ff5c1a}
.role{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;margin-top:34px}
.desc{font-family:'JetBrains Mono',monospace;font-size:19px;line-height:1.55;color:#a9a69a;margin-top:20px;max-width:860px}
.foot{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.12em}
.foot .u{color:#c8f73c}
.foot .r{color:#a9a69a}
</style>
</head>
<body>
<div class="card">
  <div class="orb"></div>
  <div class="kick">/// WEB · MOBILE · AI · LLM SYSTEMS</div>
  <h1>Arnob<br><span class="g">Rizwan</span> Ahmad<span class="z">.</span></h1>
  <div class="role">ERP Developer @ Hirdaramani Bangladesh</div>
  <div class="desc">Web platforms, mobile apps and LLM systems, plus the backend they run on. Live client sites, store apps and open-source demos.</div>
  <div class="foot"><span class="u">ARNOBRIZWAN.GITHUB.IO</span><span class="r">LIVE SITES · APPS · AI</span></div>
</div>
</body>
</html>
